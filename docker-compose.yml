version: '3.9'

services:
  instagram-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      INSTAGRAM_API_URL: ${INSTAGRAM_API_URL:-https://graph.instagram.com}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN}
    env_file:
      - .env
