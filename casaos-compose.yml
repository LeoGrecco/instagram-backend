version: '3.9'

services:
  instagram-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram-backend
    command: node dist/app.js
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      PORT: 3000
      INSTAGRAM_API_URL: https://graph.instagram.com
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-your_access_token}
    labels:
      - 'io.casaos.app.enable=true'
      - 'io.casaos.app.name=Instagram Backend'
      - 'io.casaos.app.category=Tools'
      - 'io.casaos.app.port=3000'
      - 'io.casaos.app.url=http://localhost:3000'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s
