version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: socialdeck-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER required}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD required}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB required}
    volumes:
      - socialdeck-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-socialdeck} -d ${POSTGRES_DB:-socialdeck}"]
      interval: 10s
      timeout: 5s
      retries: 5

  instagram-backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: instagram-backend
    depends_on:
      postgres:
        condition: service_healthy
    command: node dist/app.js
    restart: unless-stopped
    ports:
      - '3000:3000'
    environment:
      NODE_ENV: ${NODE_ENV:?NODE_ENV required}
      PORT: 3000
      ADMIN_EMAIL: ${ADMIN_EMAIL:?ADMIN_EMAIL required}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?ADMIN_PASSWORD required}
      INSTAGRAM_API_URL: ${INSTAGRAM_API_URL:-https://graph.instagram.com}
      INSTAGRAM_ACCESS_TOKEN: ${INSTAGRAM_ACCESS_TOKEN:-}
      APP_SECRET: ${APP_SECRET:?APP_SECRET required}
      SESSION_TTL_HOURS: ${SESSION_TTL_HOURS:-24}
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL required}
      ASAAS_API_KEY: ${ASAAS_API_KEY:-}
      ASAAS_ENVIRONMENT: ${ASAAS_ENVIRONMENT:-sandbox}
      ASAAS_WEBHOOK_TOKEN: ${ASAAS_WEBHOOK_TOKEN:?ASAAS_WEBHOOK_TOKEN required}
    labels:
      - 'io.casaos.app.enable=true'
      - 'io.casaos.app.name=Instagram Backend'
      - 'io.casaos.app.category=Tools'
      - 'io.casaos.app.port=3000'
      - 'io.casaos.app.url=http://localhost:3000'
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:3000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 20s

volumes:
  socialdeck-postgres:
